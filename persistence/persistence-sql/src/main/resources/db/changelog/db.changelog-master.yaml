databaseChangeLog:
  - changeSet:
      id: 1
      author: rummikub-group-2
      changes:
        - createTable:
            tableName: games
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: game
                  type: jsonb
                  remarks: "Game state serialized as json"